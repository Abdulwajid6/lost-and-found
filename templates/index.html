<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lost & Found Portal</title>
  <link rel="stylesheet" href="/static/styles.css" />

  <!-- Firebase INIT (ONLY ONCE) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAosHCiVohUlnyPd9FRsgW5gccl21hBlvA",
    authDomain: "lost-and-found-56582.firebaseapp.com",
    projectId: "lost-and-found-56582",
    appId: "1:508496273757:web:a3b3fa91d03bf77e0c48b4"
  };

  const app = initializeApp(firebaseConfig);
  window.auth = getAuth(app);
  window.provider = new GoogleAuthProvider();
</script>

</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>🔐 Lost & Found Portal</h1>
    <p>Login to continue</p>
    <button id="loginBtnBig">Login with Google</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="appContent" style="display:none;">
  <span id="userInfo"></span>
  <button id="logoutBtn">Logout</button>

  <form id="itemForm">
    <select id="itemType">
      <option value="lost">Lost</option>
      <option value="found">Found</option>
    </select>
    <input id="title" placeholder="Title" required />
    <button type="submit">Add</button>
  </form>

  <ul id="lostList"></ul>
  <ul id="foundList"></ul>
  <ul id="reportedList"></ul>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
