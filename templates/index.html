<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lost & Found Portal</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>


  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAosHCiVohUlnyPd9FRsgW5gccl21hBlvA",
      authDomain: "lost-and-found-56582.firebaseapp.com",
      projectId: "lost-and-found-56582",
      storageBucket: "lost-and-found-56582.firebasestorage.app",
      messagingSenderId: "508496273757",
      appId: "1:508496273757:web:a3b3fa91d03bf77e0c48b4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.auth = auth;
    window.provider = provider;
    window.signInWithPopup = signInWithPopup;
    window.signOut = signOut;
    window.onAuthStateChanged = onAuthStateChanged;
  </script>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>🔐 Lost & Found Portal</h1>
    <p>Login to continue</p>
    <button id="loginBtnBig">Login with Google</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="appContent" style="display:none;">
  <nav class="navbar">
    <div class="logo">Lost & Found</div>
    <ul class="nav-links">
      <li><a href="#formSection">Add Item</a></li>
      <li><a href="#lostFound">Items</a></li>
      <li><a href="#reported">Reported</a></li>
    </ul>
    <div class="auth-controls">
      <span id="userInfo"></span>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <section class="hero">
    <h1>Lost something? Found something?</h1>
    <p>Report or search lost and found items easily.</p>
    <a href="#formSection" class="cta-btn">Report Now</a>
  </section>

  <main>
    <section id="formSection" class="form-section">
      <h2>Add Item</h2>
      <form id="itemForm">
        <label>Type:
          <select id="itemType">
            <option value="lost">Lost</option>
            <option value="found">Found</option>
          </select>
        </label>
        <label>Title <input id="title" required></label>
        <label>Description <input id="description"></label>
        <label>Location <input id="location"></label>
        <label>Date <input type="date" id="date"></label>
        <label>Contact <input id="contact"></label>
        <label>Photo URL <input id="photo"></label>
        <button type="submit">Add Item</button>
      </form>
    </section>

    <section id="lostFound" class="list-section">
      <h2>Lost & Found Items</h2>
      <h3>Lost</h3><ul id="lostList"></ul>
      <h3>Found</h3><ul id="foundList"></ul>
    </section>

    <section id="reported" class="list-section">
      <h2>Reported Items</h2>
      <ul id="reportedList"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; Made with ❤️ by DYNAMIC DYNAMOS</p>
  </footer>
</div>

<script type="module" src="firebase-init.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
